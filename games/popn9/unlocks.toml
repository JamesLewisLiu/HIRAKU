# pop'n music 9: what the operator can unlock (tools/unlock.py; launcher: right-click > Unlocks).
#
# Operator codes (remywiki.com/AC_pnm_9), typed in test mode > EVENT OPTIONS > PASSWORD, in
# order: each moves the event phase on by one, and the game writes it at once ("PHASE UPDATED").
# The phase is one byte of the settings file in the interface board's battery RAM (m48t58y.u48):
# Konami's mirror.c keeps the file twice (settings0 at 0x0, settings1 at 0x110), each a header
# {sum, size 0x60, data sum} with the data at +0x10, the sums being of 32-bit words each XORed
# with its index (0x1ab6f8 in the EE program). The data also ends with its own sum, at +0x5c
# (0x1a9b28): five segments, each byte XORed with its index in the segment, plus 0x50; a save
# whose sum is wrong is ignored (the phase reads --). Found by typing the four codes in HIRAKU
# (oracle/scripts/popn9-phases.his), comparing the saves, and reading the program; the levels
# below are what the game wrote.

[[unlock]]
id = "phase"
title = "Event phase"
nvram = "m48t58y.u48"
offsets = [0x24, 0x134]
checksum = { kind = "mirror", files = [0x0, 0x110], size = 0x60, inner = { at = 0x5c, segments = [4, 0x20, 4, 0xc, 0x28], add = 0x50 } }
how = "In the game: test mode > EVENT OPTIONS > PASSWORD, the codes in order (the wheel: blue moves, red enters)."

[[unlock.level]]
value = 0
name = "--"
text = "No event: the songs of a new cabinet."

[[unlock.level]]
value = 1
name = "1. TATAKAE! GAMBLER Z"
code = "ZP5N28FJ96"
text = "Starts the Gambler Z event (RemyWiki: on the cabinet, its labyrinth needed an e-AMUSEMENT card)."

[[unlock.level]]
value = 2
name = "2. TATAKAE! GAMBLER Z + SECRET DATA RELEASE"
code = "89KJ95Z8UF"
text = "Also releases the secret data (RemyWiki)."

[[unlock.level]]
value = 3
name = "3. TATAKAE! GAMBLER Z DATA RELEASE"
code = "GA36EJ7B25"
text = "Also releases the Gambler Z songs and charts (RemyWiki)."

[[unlock.level]]
value = 4
name = "MAX. HITASURA MODE RELEASE"
code = "2K4VM7CHQ3"
text = "Everything: also HITASURA mode, after EXPERT in the mode select (seen in HIRAKU)."
