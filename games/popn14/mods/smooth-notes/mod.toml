name = "Smooth notes (high frame rate)"
version = "0.2"
game = "popn14"
description = "While a song plays, the machine's vsync follows the display's refresh rate (120, 144, 240 Hz...): the game draws its notes from its song clock, so they move at the display's rate, and judges as before. The animated objects (characters, hit effects) keep the cabinet's pace. Left: the GREAT/GOOD/BAD text shows for a shorter time."

[[rate]]
hz = "display"                 # the display's refresh rate (no window: 119.88); or a number, up to 1000
while_changing = 0x018ff668    # the song clock (FUN_01740298), recomputed on every frame of the play screen

[[patch]]                      # the animated objects' update reads each one's speed (percent) at +0x20; on
address = 0x01736fbc           # the vsyncs between the cabinet's ticks it reads 0, so no object moves on
original = "20006386"          # (lh v1, 0x20(s3) -> addiu v1, zero, 0)
replace = "00000324"
between_ticks = true

[[patch]]                      # an effect's 13-frame timer (FUN_017448e0, 0x00f8ad58): +1 on ticks only
address = 0x017448f0           # (addiu a0, v1, 1 -> addiu a0, v1, 0)
original = "01006424"
replace = "00006424"
between_ticks = true
