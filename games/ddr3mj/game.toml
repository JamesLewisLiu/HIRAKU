# Dance Dance Revolution 3rd Mix (GN887 VER. JAA), Konami 1999
id = "ddr3mj"
title = "Dance Dance Revolution 3rdMIX"
family = "ddr"          # DDR cabinet: 4 panels per player, menu buttons
mame = "ddr3mj"         # MAME set name, used by the oracle
core = "sys573"         # System 573 (runtime/sys573/, PLAN.md section 19); digital I/O board

[roms]
bios = "700a01.22g"             # 573 BIOS, the same chip in every set
h8 = "h8a01.bin"                # the H8's start-up response (JVS check)
cassette_eeprom = "gn887ja.u1"  # the game cassette's X76F100
cassette_id = "gn887ja.u6"      # ... and its DS2401 serial number
digital_id = "digital-id.bin"   # the digital I/O board's DS2401

[board]
io_board = "digital"            # GX894-PWB(B): FPGA + MAS3507D MP3
pccard2 = "32mb"                # a Fujitsu 32 MiB flash card in slot 2 (edit data)

[cd]
chd = "887jaa02"        # the game CD; installs to the onboard flash on first boot (install cassette)
