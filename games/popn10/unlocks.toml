# pop'n music 10: what the operator can unlock (tools/unlock.py; launcher: right-click > Unlocks).
#
# Operator codes (remywiki.com/AC_pnm_10; the same five are in the EE program at 0x33cc40),
# typed in test mode > EVENT OPTIONS > PASSWORD, in order: each moves the event phase on by one
# (0x17d4a4), and the game writes it at once ("PHASE UPDATED"). The settings file in the
# interface board's battery RAM (m48t58y.u48) is kept twice, as pop'n 9's (mirror.c: copies at
# 0x0 and 0x110, a header {sum, size 0x88, data sum}, the data at +0x10). In the data
# (0x185fa80 in RAM): +0x18 the phase, +0x28 the time phase 2 began (0x1b55f0; HOSHI NI NEGAIO's
# star quota shrinks after 20, 25, 30 and 35 days, 0x1a8ee8; left 0 here, the game then never
# shrinks it), +0x48 e-AMUSEMENT on (MAX then reads "REQUEST + ALL DATA RELEASE"), and at +0x80
# its own sum (0x1b4c10): five segments, bytes 4-7 left out, plus 0x70. Found by typing the codes
# in HIRAKU (oracle/scripts/popn10-phases.his), comparing the saves, and reading the program.

[[unlock]]
id = "phase"
title = "Event phase"
nvram = "m48t58y.u48"
offsets = [0x28, 0x138]
checksum = { kind = "mirror", files = [0x0, 0x110], size = 0x88, inner = { at = 0x80, segments = [[0, 4], [8, 0x30], [0x38, 4], [0x3c, 0xc], [0x48, 0x38]], add = 0x70 } }
how = "In the game: test mode > EVENT OPTIONS > PASSWORD, the codes in order (the wheel: blue moves, red enters)."

[[unlock.level]]
value = 0
name = "--"
text = "No event: the songs of a new cabinet."

[[unlock.level]]
value = 1
name = "1. INTERNET RANKING"
code = "5X9UJC2WSR"
text = "The internet ranking event."

[[unlock.level]]
value = 2
name = "2. HOSHI NI NEGAIO"
code = "HVARXFL26Y"
text = "Starts HOSHI NI NEGAIO: every credit's stars fill the shop's five buckets of wishes (songs, characters, an EX chart), then a black one for the HELL 10 course (event progress, below)."

[[unlock.level]]
value = 3
name = "3. HOSHI NI NEGAIO + SECRET DATA RELEASE"
code = "A6Y76WPV26"
text = "Also releases the secret data (RemyWiki)."

[[unlock.level]]
value = 4
name = "4. HOSHI NI NEGAIO DATA RELEASE"
code = "M8DAPTU6HN"
text = "Also releases everything the wishes give, granted or not (the game's own check)."

[[unlock.level]]
value = 5
name = "MAX. ALL DATA RELEASE"
code = "5W9LZYKDWW"
text = "Everything."

# HOSHI NI NEGAIO (phases 2 and 3): the shop's buckets of stars, kept in the same settings record
# (both copies; little-endian). A credit's stars fall into the buckets (0x1a3a40); when a bucket's
# stars reach its current wish's cost, the wish is granted (its bit set in the items word), the
# bucket's level goes up and its stars start again from 0 (0x1a81a8). With all five buckets done,
# a black bucket of 7,700 stars grants the last bit (the HELL 10 course, course 6). In phases 2 and
# 3 a wish's song or character is playable once its bit is set (0x161cf8, 0x161ec8); at phase 4 or
# MAX all are, bits or not (0x13d330); at phase 0 or 1 none. Found in the program (the bucket and
# wish tables at 0x367460 and 0x367538, the wishes' own texts) and checked in HIRAKU: a credit at
# phase 2 put its stars in bucket 1. Songs not listed here (GOONIES, ペガサス幻想, ...) are not
# event songs in pop'n 10's data: they are always playable.
[[progress]]
id = "hoshi"
title = "HOSHI NI NEGAIO"
kind = "wishes"
nvram = "m48t58y.u48"
checksum_of = "phase"
copies = [0x10, 0x120]
active = { unlock = "phase", values = [2, 3] }
released = { unlock = "phase", values = [4, 5] }
levels = 0x19
stars = 0x1e
items = 0x30
black = { bit = 36, stars = 7700, gives = "the HELL 10 course (course 6)" }
buckets = [
  { name = "bucket 1", wishes = [28, 0, 10, 30, 20, 33, 22] },
  { name = "bucket 2", wishes = [4, 31, 7, 17, 18, 9, 24] },
  { name = "bucket 3", wishes = [3, 29, 5, 8, 19, 27, 21] },
  { name = "bucket 4", wishes = [6, 16, 34, 2, 15, 12, 25, 26] },
