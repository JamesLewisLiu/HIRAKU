# pop'n music 13 Carnival: what the operator can unlock (tools/unlock.py; launcher: right-click > Unlocks).
#
# Operator codes (in the program in RAM at 0x1929e00), typed in test mode > EVENT OPTIONS: the
# menu shows only EXIT, but blue right then red opens PHASE PASSWORD (the four codes, in order,
# each moving the phase on by one) and blue left then red EXTRA PASSWORD (0x17cdd48). The
# settings file in the battery RAM (m48t58y.u48) is kept twice as pop'n 9's (mirror.c: copies at
# 0x0 and 0x110, a header {sum, size 0xd8, data sum}, the data at +0x10). In the data (0x1669a80
# in RAM): +0x0c the phase (0x1806fc0), +0x0d EXTRA (0x1806fe0), +0x54 POP'N LAND's and POP'N
# WORLD's record (below), and at +0xd4 its own sum (0x1806620): six segments, plus 0xcc. Found by
# typing the codes in HIRAKU (oracle/scripts/popn13-phases.his), comparing the saves, and
# reading the program.

[[unlock]]
id = "phase"
title = "Event phase"
nvram = "m48t58y.u48"
offsets = [0x1c, 0x12c]
checksum = { kind = "mirror", files = [0x0, 0x110], size = 0xd8, inner = { at = 0xd4, segments = [4, 0xc, 4, 8, 0x38, 0x80], add = 0xcc } }
how = "In the game: test mode > EVENT OPTIONS, blue right then red (PHASE PASSWORD), the codes in order (the wheel: blue moves, red enters)."

[[unlock.level]]
value = 0
name = "--"
text = "No event: the songs of a new cabinet."

[[unlock.level]]
value = 1
name = "1. POP'N LAND + SECRET DATA RELEASE"
code = "H83J8W6Q4C"
text = "Starts POP'N LAND, whose points open songs, charts and course 6 (event progress, below), and releases the secret songs."

[[unlock.level]]
value = 2
name = "2. POP'N WORLD + POP'N LAND DATA RELEASE"
code = "QXTDCF7KTU"
text = "Starts POP'N WORLD (songs, charts and course 7), and releases everything POP'N LAND gives."

[[unlock.level]]
value = 3
name = "3. POP'N WORLD DATA RELEASE"
code = "PLREGPRLTJ"
text = "Also releases everything POP'N WORLD gives."

[[unlock.level]]
value = 4
name = "MAX. ALL DATA RELEASE"
code = "QYCWFXLVKA"
text = "Everything (but BEMANI EXPO's, below)."

[[unlock]]
id = "extra"
title = "EXTRA"
nvram = "m48t58y.u48"
offsets = [0x1d, 0x12d]
checksum = { kind = "mirror", files = [0x0, 0x110], size = 0xd8, inner = { at = 0xd4, segments = [4, 0xc, 4, 8, 0x38, 0x80], add = 0xcc } }
how = "In the game: test mode > EVENT OPTIONS, blue left then red (EXTRA PASSWORD), the code."

[[unlock.level]]
value = 0
name = "--"
text = "Not released."

[[unlock.level]]
value = 1
name = "MAX. BEMANI EXPO RELEASE"
code = "9JXWF5CFKJ"
text = "Releases the BEMANI EXPO songs: アジアンミクスチャー, ピアノトロニカ, クイズマジックアカデミー (the music table's flag 0x10000000; 0x17a2148)."

# POP'N LAND (phase 1) and POP'N WORLD (phase 2): the shop's. Their record, in the settings (both
# copies; little-endian, 0x1669ad4 in RAM): from +0x54 a points counter per song (28: LAND's 14,
# then WORLD's), and at +0xc4/+0xcc (LAND) and +0xc8/+0xd0 (WORLD) the words of what they reach.
# A credit's points go to one song (0x17fb798); each of its charts opens once its counter reaches
# the chart's mark, and the words are worked out again (0x17fb208; the table at 0x190e800, the
# bits at 0x199e860). A chart is playable while its area runs once its bit is set (0x17fa470); an
# area's last entry opens a course (0x1811b58). LAND's everything is released from phase 2, WORLD's
# from phase 3. Songs named by their genres; "HYPER" and "EX" are the charts an older song gains.
[[progress]]
id = "land"
title = "POP'N LAND and POP'N WORLD"
kind = "thresholds"
nvram = "m48t58y.u48"
checksum_of = "phase"
copies = [0x10, 0x120]
offset = 0x54

