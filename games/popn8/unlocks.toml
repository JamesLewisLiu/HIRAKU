# pop'n music 8: what the operator can unlock (tools/unlock.py; launcher: right-click > Unlocks).
#
# The event phase is the operator's EVENT OPTIONS > PASSWORD, one code per phase, in order
# (codes: remywiki.com/AC_pnm_8). The game keeps the phase as one byte of its battery RAM,
# three times over, with no checksum. Found by entering the four codes in HIRAKU
# (oracle/scripts/popn8-phases.his), each from the save the previous one left, and comparing
# the save: only these three bytes changed, 0 -> 1 -> 2 -> 3 -> 4. At MAX the music select
# has a "secret" category with the title-screen timing songs.

[[unlock]]
id = "phase"
title = "Event phase"
nvram = "rtc.nv"
offsets = [0xbf, 0x57b, 0xa37]
how = "In the game: test mode > EVENT OPTIONS > PASSWORD, the codes in order."

[[unlock.level]]
value = 0
name = "--"
text = "No event: the songs of a new cabinet."

[[unlock.level]]
value = 1
name = "1.SUGOROKU de 8"
code = "IZCDMNKXCN"
text = "Starts the Sugoroku de 8 event: play it to unlock the songs city by city (Event progress, below)."

[[unlock.level]]
value = 2
name = "2.SUGOROKU de 8 + SECRET DATA RELEASE"
code = "IDEZ1VSXKD"
text = "Unlocks the LIVE songs and EX charts for all default songs; Sugoroku de 8 still runs."

[[unlock.level]]
value = 3
name = "3.SUGOROKU de 8 DATA RELEASE"
code = "WHWTMHQZ8T"
text = "Unlocks all Sugoroku de 8 songs, their hidden characters, and all expert courses."

[[unlock.level]]
value = 4
name = "MAX.ALL DATA RELEASE"
code = "ARCVWZGFEP"
text = "Everything: also the hidden title-screen songs and their characters, and the expert-course-only songs in every mode."

# The Sugoroku de 8 event, as the game plays it (phases 1 and 2). Found in the program
# (FUN_800bab40, FUN_800b8e64, the board at 0x800bcad0, the cities at 0x800bb5d0) and checked
# with autoplayed credits (PLAN.md section 20). After a round whose requirement was met, a
# roulette (1-6) moves KRAFT along a ring of 1004 spaces with 18 cities. The first time around
# a stage, a city's unlock needs an exact landing; a city passed is "missed" and given on the
# next pass. As RemyWiki has it: stage 1 the songs (18 cities), stage 2 the courses (8 cities)
# and the island songs (land exactly on 鹿児島, 金沢 or 東京), stage 3 the characters; finishing
# everything gives the HELL the 8 course.
# The fields are big-endian 32-bit values of the event block, kept three times like the phase.
[[progress]]
id = "sugoroku"
title = "Sugoroku de 8"
nvram = "rtc.nv"
copies = [0x0, 0x4bc, 0x978]
active = { unlock = "phase", values = [1, 2] }
stage = 0xc0
unlocked = 0xc4
missed = 0xc8
position = 0xcc
lap = 0xd0
spaces = 1004
stages = [
  { name = "the songs", goal = 0x3ffff },
  { name = "the courses and island songs", goal = 0x7f8 },
  { name = "the characters", goal = 0x1fffff },
]
# in route order; stages: bit k = a city in stage k+1; masks: its unlock bit per stage
cities = [
  { name = "静岡", romaji = "SHIZUOKA", space = 27, stages = 7, masks = [0x20, 0x8, 0x20000] },
