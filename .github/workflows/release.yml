# SPDX-License-Identifier: GPL-3.0-or-later
# HIRAKU's release packages (PLAN.md section 28): a Linux .tar.xz and a Windows .zip that run the
# DJ Main, System 573 and Twinkle games from the user's own dropped-in data, with nothing else to
# install. Built with HK_GAME_BINARIES off: nothing in them comes from a game (a clean checkout has
# no build/ or dumps/ anyway).
#
# - a push of a tag v*: both packages, published as a GitHub release (a draft, to look over first),
#   with the LGPL libraries' sources beside them;
# - by hand (Actions > release > Run workflow): both packages as the run's artifacts.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    # 22.04: the package runs on glibc 2.35 and later
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - name: Build tools
        run: sudo tools/release-setup-ubuntu.sh python
      - name: Cache the libraries
        uses: actions/cache@v6
        with:
          path: ~/hiraku-deps
          key: linux-deps-${{ hashFiles('tools/release-deps-linux.sh', 'tools/ffmpeg-min.sh') }}
      - name: Libraries (SDL3, zstd, FFmpeg, Qt, Python, 7-Zip)
        run: tools/release-deps-linux.sh ~/hiraku-deps
      - name: Cache PCSX2 Reliquary's libraries
        uses: actions/cache@v6
        with:
          path: ~/hiraku-python/deps
          key: python-deps-${{ hashFiles('tools/release-python-linux.sh') }}
      - name: The Konami Python core (PCSX2 Reliquary 1.9.4, hiraku-python)
        run: tools/release-python-linux.sh ~/hiraku-python ~/hiraku-deps
      - name: Build and package
        run: HK_PYTHON_WORK=~/hiraku-python tools/release.sh linux dist ~/hiraku-deps
      - name: The LGPL libraries' sources
        run: cp ~/hiraku-deps/src/ffmpeg-*.tar.xz ~/hiraku-deps/src/SDL3-*.tar.gz dist/
      - uses: actions/upload-artifact@v7
        with:
          name: hiraku-linux
          path: dist/*

  windows:
    # Cross-built on Linux (PLAN.md section 26), in Arch: its mingw-w64 and clang are what the
    # Windows port was made with, and its Qt's moc, rcc and uic build the launcher against the
    # static Windows qtbase of the same version
    runs-on: ubuntu-latest
    container: archlinux:latest
    timeout-minutes: 240
    steps:
      - name: Build tools
        run: |
          pacman -Syu --noconfirm --needed base-devel git clang lld llvm mingw-w64-gcc qt6-base cmake ninja \
            nasm python p7zip zip curl
      - uses: actions/checkout@v7
      - name: Qt's version
        id: qt
        run: echo "version=$(qmake6 -query QT_VERSION)" >> "$GITHUB_OUTPUT"
      - name: Cache the libraries
        uses: actions/cache@v6
        with:
          path: out/win-deps
          key: windows-deps-qt${{ steps.qt.outputs.version }}-${{ hashFiles('tools/release-deps-windows.sh', 'tools/win-deps.sh', 'tools/ffmpeg-min.sh', 'cmake/x86_64-w64-mingw32.cmake') }}
      - name: Libraries (SDL3, zlib, zstd, static Qt, Python, FFmpeg, 7-Zip)
        run: HK_QT_BUILD=$RUNNER_TEMP/qt tools/release-deps-windows.sh
      - name: Build and package
        run: tools/release.sh windows dist
      - uses: actions/upload-artifact@v7
        with:
          name: hiraku-windows
          path: dist/*

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'EOF'
          **Download** `hiraku-windows-x86_64.zip` (Windows 10 or later) or `hiraku-linux-x86_64.tar.xz` (glibc 2.35 or later: Ubuntu 22.04, Debian 12, Fedora 36 and newer), unpack it anywhere, and start the launcher (`bin\hiraku.exe`, `bin/hiraku`). Drop your own game data on its window: the MAME ROM set (.zip, .7z or a folder) and its CHDs, all at once. Nothing else to install.

          **Games that run from this release:** DJ Main (beatmania 1st MIX to THE FINAL, beatmania CORE REMIX, pop'n music 1-3, pop'n stage, hiphopmania), System 573 (Dance Dance Revolution 1st MIX to EXTREME and Dancing Stage, GuitarFreaks and DrumMania 1st to 10th/11th Mix, Percussion Freaks) and Twinkle (beatmania IIDX 1st to 8th style and Substream, with the background video). Some versions still need a dump nobody has made; each game's page in the launcher says what it needs.

          **Firebeat** (beatmania III, pop'n music 4-8, ParaParaParadise, Keyboardmania) too: HIRAKU finds its way around each game's program by itself.

          **Konami Python** (pop'n music 9-14, DrumMania V/V2) in the Linux package: add the game's folder together with the folders `bios` (the arcade BIOS) and `keys` (the MagicGate key files), which HIRAKU can't ship. They need Vulkan or OpenGL drivers. Not yet in the Windows package.

          The packages are portable: settings and saves stay in their `user` folder. The FFmpeg and SDL3 source archives are here for their LGPL/zlib licences; the Linux package's Python core is built from PCSX2 Reliquary 1.9.4 (GPL-3.0), whose source is the reliquary-1.9.4 release's zip, with HIRAKU's oracle/pcsx2/reliquary-oracle.patch.
          EOF
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --draft --title "HIRAKU $GITHUB_REF_NAME" --notes-file notes.md
